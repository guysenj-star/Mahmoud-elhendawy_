<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الأبطال المتكامل | محمود الهنداوي</title>
    <style>
        /* 🎨 أنظمة الألوان الاحترافية */
        :root {
            --bg-dark: #07090d;
            --bg-card: #151a22;
            --primary: #00e6b8;
            --secondary: #ffb703;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* 🚫 إخفاء أزرار الراديو */
        .hidden-radio { display: none; }

        /* 🧭 شريط التنقل */
        .navbar {
            background-color: #0f141b;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary);
        }

        .nav-label {
            color: var(--text-muted);
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 8px;
        }

        #tab-home:checked ~ .navbar .label-home,
        #tab-diet:checked ~ .navbar .label-diet,
        #tab-workout:checked ~ .navbar .label-workout {
            background-color: var(--primary);
            color: var(--bg-dark);
        }

        .page-content { display: none; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        /* 🪄 إظهار الصفحات */
        #tab-home:checked ~ .pages-wrapper #page-home { display: block; }
        #tab-diet:checked ~ .pages-wrapper #page-diet { display: block; }
        #tab-workout:checked ~ .pages-wrapper #page-workout { display: block; }

        /* 🏠 الرئيسية */
        .hero-section { text-align: center; background: #10161e; border: 2px solid var(--secondary); border-radius: 20px; padding: 60px 20px; }
        .prayer-box { border: 2px dashed var(--primary); padding: 20px; border-radius: 15px; display: inline-block; font-size: 1.8rem; font-weight: bold; margin-top: 20px; }

        /* 🍏 التغذية */
        .card { background-color: var(--bg-card); border-radius: 16px; padding: 30px; margin-bottom: 30px; border: 1px solid #1f2733; }
        .input-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; background: #0b0e14; border: 1px solid #2a3441; color: #fff; border-radius: 8px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* 🏋️‍♂️ التمارين */
        .sub-nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .sub-label { background-color: #1f2733; color: var(--primary); border: 1px solid var(--primary); padding: 10px 15px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        
        #w-ppl:checked ~ .sub-nav .l-ppl, #w-arnold:checked ~ .sub-nav .l-arnold,
        #w-ul:checked ~ .sub-nav .l-ul, #w-fb:checked ~ .sub-nav .l-fb, #w-int:checked ~ .sub-nav .l-int { background-color: var(--primary); color: #000; }
        
        .workout-content { display: none; }
        #w-ppl:checked ~ .workouts-wrapper #c-ppl, #w-arnold:checked ~ .workouts-wrapper #c-arnold,
        #w-ul:checked ~ .workouts-wrapper #c-ul, #w-fb:checked ~ .workouts-wrapper #c-fb, #w-int:checked ~ .workouts-wrapper #c-int { display: block; }
        
        .day-card { background: #151a22; border-top: 4px solid var(--primary); padding: 20px; border-radius: 12px; margin-top: 20px; }
    </style>
</head>
<body>

    <input type="radio" name="main_nav" id="tab-home" class="hidden-radio" checked>
    <input type="radio" name="main_nav" id="tab-diet" class="hidden-radio">
    <input type="radio" name="main_nav" id="tab-workout" class="hidden-radio">

    <nav class="navbar">
        <label for="tab-home" class="nav-label label-home">🏠 الرئيسية</label>
        <label for="tab-diet" class="nav-label label-diet">🍏 التغذية</label>
        <label for="tab-workout" class="nav-label label-workout">🏋️‍♂️ التمارين</label>
    </nav>

    <div class="pages-wrapper">
        <div class="page-content" id="page-home">
            <div class="hero-section">
                <h1>موقع الأبطال المتكامل</h1>
                <div class="prayer-box">
                    يارب <span style="color:var(--primary)">محمود الهنداوي</span> و <span style="color:var(--primary)">سلكاوي</span><br>
                    يقفلوها ويجيبو <span style="color:var(--secondary)">95%</span> في 3 ثانوي! 🎯
                </div>
            </div>
        </div>

        <div class="page-content" id="page-diet">
            <div class="card">
                <h2>حاسبة البروتين</h2>
                <input type="number" id="w_cal" placeholder="الوزن (كجم)">
                <button class="btn-action" style="margin-top:15px" onclick="calc()">احسب النتائج</button>
                <div id="res" style="margin-top:20px; display:none;"><h3>احتياجك: <span id="prot" style="color:var(--primary)">0</span> جرام بروتين</h3></div>
            </div>
        </div>

        <div class="page-content" id="page-workout">
            <input type="radio" name="workout_nav" id="w-ppl" class="hidden-radio" checked>
            <input type="radio" name="workout_nav" id="w-arnold" class="hidden-radio">
            <input type="radio" name="workout_nav" id="w-ul" class="hidden-radio">
            <input type="radio" name="workout_nav" id="w-fb" class="hidden-radio">
            <input type="radio" name="workout_nav" id="w-int" class="hidden-radio">

            <div class="sub-nav">
                <label for="w-ppl" class="sub-label l-ppl">PPL</label>
                <label for="w-arnold" class="sub-label l-arnold">Arnold</label>
                <label for="w-ul" class="sub-label l-ul">Upper/Lower</label>
                <label for="w-fb" class="sub-label l-fb">Full Body</label>
                <label for="w-int" class="sub-label l-int">Interior/Posterior</label>
                <label class="sub-label" onclick="broSplit()">Bro Split (❌)</label>
            </div>

            <div class="workouts-wrapper">
                <div class="workout-content" id="c-ppl"><div class="day-card"><h4>PPL</h4><p>دفع، سحب، أرجل</p></div></div>
                <div class="workout-content" id="c-arnold"><div class="day-card"><h4>Arnold</h4><p>صدر وظهر، كتف وذراع، أرجل</p></div></div>
                <div class="workout-content" id="c-ul"><div class="day-card"><h4>Upper/Lower</h4><p>علوي، سفلي</p></div></div>
                <div class="workout-content" id="c-fb"><div class="day-card"><h4>Full Body</h4><p>جسم كامل</p></div></div>
                <div class="workout-content" id="c-int"><div class="day-card"><h4>Interior/Posterior</h4><p>أماميات وخلفيات</p></div></div>
            </div>
        </div>
    </div>

    <script>
        function calc() {
            let w = document.getElementById('w_cal').value;
            if(w) { document.getElementById('prot').innerText = Math.round(w * 2.2); document.getElementById('res').style.display = 'block'; }
        }
        function broSplit() {
            alert("يا كابتن Bro Split إيه؟! إحنا في 2026! مع السلامة.. روح العب بعيد 😂👋");
            window.location.href = "https://www.google.com";
        }
    </script>
</body>
</html>
