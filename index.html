<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع الجيم المتكامل</title>

<style>
body{
    font-family: Arial;
    background:#121212;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}

.header{
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

h2{color:#ffcc00}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:6px;
    border:none;
    background:#2b2b2b;
    color:white;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
    background:#00ffcc;
    font-weight:bold;
}

button:hover{background:#ffcc00}

.box{
    background:#1e1e1e;
    padding:15px;
    margin-top:20px;
    border-radius:12px;
}

.grid{
    display:none;
    margin-top:20px;
}

.grid.active{
    display:block;
}

.card{
    background:#151515;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    text-align:right;
}

footer{
    margin-top:30px;
    border-top:1px solid #333;
    padding-top:15px;
}

.water{
    font-size:22px;
    color:#00ffcc;
}
</style>
</head>

<body>

<div class="header">
<h1>💪 موقع الجيم</h1>
</div>

<!-- 🔥 CALCULATOR -->
<div class="box">
<h2>حاسبة السعرات</h2>

<input id="weight" placeholder="الوزن">
<input id="height" placeholder="الطول">
<input id="age" placeholder="العمر">

<select id="activity">
<option value="1.2">قليل</option>
<option value="1.55">متوسط</option>
<option value="1.7">عالي</option>
</select>

<button onclick="calc()">احسب</button>

<div id="result"></div>

<button onclick="diet('cut')">تنشيف</button>
<button onclick="diet('bulk')">تضخيم</button>

<div id="dietBox"></div>
</div>

<!-- 🔥 WORKOUT -->
<div class="box">
<h2>أنظمة التمرين</h2>

<button onclick="show('ppl')">PPL</button>
<button onclick="show('ul')">Upper/Lower</button>
<button onclick="show('fb')">Full Body</button>

<div id="ppl" class="grid active">
<div class="card">
<h3>PUSH</h3>
<p>بنش - كتف - تراي</p>
</div>

<div class="card">
<h3>PULL</h3>
<p>ظهر - باي</p>
</div>

<div class="card">
<h3>LEGS</h3>
<p>رجل كامل</p>
</div>
</div>

<div id="ul" class="grid">
<div class="card">
<h3>UPPER</h3>
<p>صدر + ظهر + ذراع</p>
</div>

<div class="card">
<h3>LOWER</h3>
<p>رجل + بطن</p>
</div>
</div>

<div id="fb" class="grid">
<div class="card">
<h3>Full Body</h3>
<p>كل الجسم في يوم واحد</p>
</div>
</div>

</div>

<!-- 💧 WATER -->
<div class="box">
<h2>💧 المياه</h2>

<div class="water" id="water">0 / 8</div>

<button onclick="addWater()">+ كوب</button>
<button onclick="resetWater()">Reset</button>
</div>

<!-- 📊 TRACK -->
<div class="box">
<h2>📊 تتبع الوزن في التمارين</h2>

<input placeholder="Bench Press">
<input placeholder="Squat">
<input placeholder="Deadlift">
</div>

<footer>
<p>💪 استمر يا بطل</p>
</footer>

<script>

let calories = 2000;
let water = 0;

function calc(){
let w = +document.getElementById("weight").value;
let h = +document.getElementById("height").value;
let a = +document.getElementById("age").value;
let act = +document.getElementById("activity").value;

if(!w || !h || !a){
alert("دخل البيانات");
return;
}

let bmr = (10*w)+(6.25*h)-(5*a)+5;
calories = Math.round(bmr*act);

document.getElementById("result").innerHTML =
"السعرات: " + calories + "<br> البروتين: " + Math.round(w*2);
}

function diet(type){

if(type=="cut"){
document.getElementById("dietBox").innerHTML =
"تنشيف: " + (calories-500) + "<br> 3 بيض + ربع فرخة + رز";
}else{
document.getElementById("dietBox").innerHTML =
"تضخيم: " + (calories+500) + "<br> 3 بيض + رز + فراخ + عيش";
}

}

function show(id){

document.getElementById("ppl").classList.remove("active");
document.getElementById("ul").classList.remove("active");
document.getElementById("fb").classList.remove("active");

document.getElementById(id).classList.add("active");

}

function addWater(){
if(water<8){
water++;
document.getElementById("water").innerText = water + " / 8";
}
}

function resetWater(){
water=0;
document.getElementById("water").innerText = "0 / 8";
}

</script>

</body>
</html>
