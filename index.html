<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقع الأبطال | محمود الهنداوي</title>
    <style>
        body { background: #07090d; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        .nav-bar { display: flex; justify-content: center; background: #0f141b; padding: 15px; border-bottom: 2px solid #00e6b8; }
        .nav-btn { background: none; border: 1px solid #00e6b8; color: #00e6b8; padding: 10px 20px; margin: 0 10px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .nav-btn:hover, .nav-btn.active { background: #00e6b8; color: #000; }
        .tab-content { display: none; padding: 20px; max-width: 800px; margin: auto; }
        .tab-content.active { display: block; }
        .card { background: #151a22; padding: 20px; border-radius: 10px; margin-top: 20px; border-top: 3px solid #ffb703; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #0b0e14; border: 1px solid #2a3441; color: #fff; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #00e6b8; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="showTab('home')">🏠 الرئيسية</button>
        <button class="nav-btn" onclick="showTab('diet')">🍏 التغذية</button>
        <button class="nav-btn" onclick="showTab('workout')">🏋️‍♂️ التمارين</button>
    </div>

    <div id="home" class="tab-content active">
        <div class="card" style="text-align: center;">
            <h1>موقع الأبطال المتكامل</h1>
            <h2 style="color: #ffb703;">يارب محمود الهنداوي وسلكاوي يقفلوها ويجيبو 95% في 3 ثانوي! 🎯</h2>
        </div>
    </div>

    <div id="diet" class="tab-content">
        <div class="card">
            <h2>حاسبة وتوليد نظام غذائي</h2>
            <input type="number" id="weight" placeholder="الوزن (كجم)">
            <input type="number" id="height" placeholder="الطول (سم)">
            <input type="number" id="age" placeholder="السن">
            <select id="goal">
                <option value="cut">🔥 تنشيف</option>
                <option value="bulk">💪 تضخيم</option>
            </select>
            <button onclick="generateDiet()">توليد النظام</button>
            <div id="result" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div id="workout" class="tab-content">
        <div class="card">
            <h2>أنظمة التمرين</h2>
            <p>اختر النظام من القائمة (قريباً جداً ستكون تبديل تلقائي)</p>
            <div id="workout-list">
                <h3>نظام PPL (دفع، سحب، أرجل)</h3>
                <p>يوم 1: صدر وكتف وتراي ... يوم 2: ظهر وباي ... يوم 3: أرجل</p>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function generateDiet() {
            let weight = document.getElementById('weight').value;
            let goal = document.getElementById('goal').value;
            let res = document.getElementById('result');
            if(!weight) { alert("دخل وزنك!"); return; }
            
            let protein = weight * 2.2;
            let diet = goal === 'cut' ? 
                `<li>افطار: 5 بيضات مسلوقة + شوفان</li><li>غداء: 200ج صدور دجاج + 100ج أرز</li>` : 
                `<li>افطار: 4 بيضات + 100ج شوفان ولبن</li><li>غداء: 250ج لحم + 300ج أرز + بطاطس</li>`;
            
            res.innerHTML = `<h3>البروتين المطلوب: ${Math.round(protein)} جرام</h3><ul>${diet}</ul>`;
        }
    </script>
</body>
</html>
