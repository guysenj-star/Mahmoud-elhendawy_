<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 Not Found</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #e8eaed;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    main {
      width: 100%;
      max-width: 600px;
    }

    .error-code {
      color: #9aa0a6;
      font-size: 13px;
      margin-bottom: 26px;
      direction: ltr;
      text-align: left;
    }

    h1 {
      font-size: 27px;
      font-weight: 400;
      line-height: 1.7;
      margin: 0 0 16px;
    }

    p {
      color: #bdc1c6;
      font-size: 15px;
      line-height: 2;
      margin: 0;
    }

    .line {
      height: 1px;
      background: #303134;
      margin: 26px 0;
    }

    .footer {
      color: #80868b;
      font-size: 12px;
      direction: ltr;
      text-align: left;
    }
  </style>
</head>

<body>
  <main>
    <div class="error-code">ERROR 404 · NOT FOUND</div>

    <h1>هذا الموقع غير متاح</h1>

    <p>
      تم مسح محتوى الموقع بواسطة المطوّر.
      لم يعد المحتوى السابق متاحًا.
    </p>

    <div class="line"></div>

    <div class="footer">HTTP ERROR 404</div>
  </main>
</body>
</html>
