<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلى ريمو ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:Tahoma,Arial,sans-serif;
  background:radial-gradient(circle at 20% 20%,#3a1230 0,#160b1b 38%,#08070d 100%);
  color:#fff;overflow-x:hidden;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
 background-image:radial-gradient(#fff 1px,transparent 1px);
 background-size:35px 35px;
}
.heart{position:fixed;color:#ff7eb6;opacity:.35;animation:float 8s linear infinite;z-index:0}
@keyframes float{from{transform:translateY(110vh) scale(.7);opacity:0}15%{opacity:.4}to{transform:translateY(-15vh) scale(1.2);opacity:0}}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px;position:relative;z-index:2}
.card{
 width:min(430px,100%);padding:34px 25px;border:1px solid #ffffff1c;
 background:#ffffff0b;backdrop-filter:blur(18px);border-radius:28px;
 box-shadow:0 25px 80px #0008;text-align:center;
}
.logo{font-size:48px;margin-bottom:8px}
h1{font-size:30px;margin-bottom:8px}
.sub{color:#d8c8d5;margin-bottom:25px;line-height:1.8}
input{
 width:100%;padding:15px 17px;margin:7px 0;border-radius:14px;border:1px solid #ffffff1c;
 background:#08070d99;color:#fff;outline:none;font-size:16px;text-align:center;
}
input:focus{border-color:#ff78ad;box-shadow:0 0 0 3px #ff78ad18}
button{
 border:0;border-radius:14px;padding:15px 22px;margin-top:12px;width:100%;
 background:linear-gradient(135deg,#ff4f91,#b83b91);color:white;font-size:17px;
 font-weight:bold;cursor:pointer;box-shadow:0 10px 30px #ff4f9135;
 transition:.25s;
}

#achievementToast.show{opacity:1;transform:translateY(0) scale(1)}

#achievementToast .toast-title{color:#ffc4dc;font-size:12px;margin-bottom:3px}
#achievementToast .toast-name{color:#fff;font-size:16px;font-weight:bold}

.error{height:24px;color:#ff91b9;font-size:13px;margin-top:8px}
#site{display:none}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
.hero-box{max-width:850px}
.badge{display:inline-block;padding:8px 14px;border-radius:50px;background:#ffffff0b;border:1px solid #ffffff16;color:#ffc4dc;margin-bottom:20px}
.hero h2{font-size:clamp(42px,10vw,82px);line-height:1.05;margin-bottom:20px}
.hero h2 span{color:#ff77ad}
.hero p{font-size:19px;line-height:2;color:#dfd3dc;max-width:700px;margin:auto}
.scroll{margin-top:35px;color:#ff9bc2;animation:bounce 1.6s infinite}
@keyframes bounce{50%{transform:translateY(8px)}}
section{padding:80px 20px}
.container{max-width:950px;margin:auto}
.title{text-align:center;font-size:34px;margin-bottom:35px}
.title span{color:#ff77ad}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.box{
 background:#ffffff09;border:1px solid #ffffff12;border-radius:22px;padding:25px;
 min-height:170px;box-shadow:0 15px 45px #0003;
}
.icon{font-size:32px;margin-bottom:12px}.box h3{margin-bottom:10px}.box p{color:#cfc1ca;line-height:1.8}
.letter{
 max-width:760px;margin:auto;padding:35px;border-radius:25px;
 background:linear-gradient(145deg,#ffffff0d,#ffffff05);border:1px solid #ffffff13;
 line-height:2.1;color:#e9dfe6;font-size:17px;
}
.highlight{color:#ff9bc2;font-weight:bold}
.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:600px;margin:30px auto}
.counter div{padding:20px 8px;border-radius:18px;background:#ffffff09;border:1px solid #ffffff12}
.counter b{display:block;font-size:28px;color:#ff87b6}
.final{text-align:center;padding-bottom:100px}
.final button{max-width:330px}
#surprise{display:none;margin:30px auto 0;max-width:650px;padding:30px;border-radius:25px;background:#ff4f9110;border:1px solid #ff78ad33;line-height:2}
footer{text-align:center;padding:25px;color:#9f8f9b;font-size:13px}
@media(max-width:500px){.card{padding:28px 18px}.letter{padding:24px}.counter b{font-size:22px}}

.timeline{max-width:760px;margin:30px auto;position:relative}
.timeline-item{display:flex;align-items:center;gap:18px;margin:24px 0}
.timeline-item:nth-of-type(odd){flex-direction:row}
.date{min-width:145px;text-align:center;color:#ff9bc2;font-weight:bold;font-size:15px}
.timeline-card{flex:1;background:#ffffff09;border:1px solid #ffffff12;border-radius:22px;padding:24px;box-shadow:0 15px 45px #0003}
.timeline-card h3{margin-bottom:9px}
.timeline-card p{color:#cfc1ca;line-height:1.8}
.timeline-card .icon{font-size:30px;margin-bottom:8px}
.line{width:2px;height:35px;background:linear-gradient(#ff77ad,transparent);margin:0 auto}
.timeline-item.future .timeline-card{border-color:#ff77ad30;background:#ff77ad08}
.secret-label{display:inline-block;padding:8px 15px;border:1px solid #ff77ad35;border-radius:50px;color:#ffabc9;background:#ff77ad09;margin-bottom:20px}
#surprise{overflow:hidden;transform:translateY(12px);opacity:0;transition:1s ease;max-width:700px;margin:30px auto 0;padding:38px;border-radius:28px;background:radial-gradient(circle at 50% 0,#ff77ad1b,#ffffff05 55%);border:1px solid #ff77ad35;line-height:2.05}
#surprise.show{transform:translateY(0);opacity:1}
.reveal-hearts{font-size:32px;letter-spacing:12px;color:#ff8fba;margin-bottom:15px;animation:pulse 1.5s infinite}
.big-date{font-weight:bold;font-size:25px;line-height:1.4;color:#ffc1d9;margin:15px 0 22px}
.big-date span{font-size:20px;color:#ff77ad}
#surprise h2{font-size:30px;margin-bottom:15px}
#surprise .tiny{font-size:12px;color:#a997a4;margin-top:25px}
@keyframes pulse{50%{transform:scale(1.08)}}
@media(max-width:600px){
 .timeline-item{flex-direction:column!important;align-items:stretch}
 .date{min-width:0;text-align:right;padding-right:8px}
 .line{display:none}
}


.live-counter{grid-template-columns:repeat(3,1fr);max-width:720px}
.live-counter div{min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.live-counter b{font-size:30px}
.live-counter span{color:#cfc1ca;font-size:14px}
.letter-title{text-align:center;color:#ff9bc2;font-size:24px;font-weight:bold;margin-bottom:22px}
.letter{white-space:normal;text-align:right}
.tasks{max-width:650px;margin:30px auto 15px;display:grid;gap:14px}
.task{display:flex;align-items:center;gap:14px;padding:20px;border-radius:20px;background:#ffffff09;border:1px solid #ffffff12;cursor:pointer;transition:.25s}
.task:hover{transform:translateY(-2px);background:#ffffff0d}
.task input{display:none}
.check{width:27px;height:27px;flex:none;border:2px solid #ff77ad;border-radius:8px;position:relative}
.task input:checked + .check{background:linear-gradient(135deg,#ff4f91,#b83b91)}
.task input:checked + .check:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-weight:bold}
.task input:checked ~ .task-text{opacity:.55;text-decoration:line-through}
.task-text{display:flex;flex-direction:column;gap:5px}
.task-text strong{font-size:17px}
.task-text small{color:#bcaeb9;line-height:1.6}
.reset-tasks{display:block;width:auto;margin:15px auto 0;padding:10px 18px;background:#ffffff0b;border:1px solid #ffffff12;box-shadow:none;font-size:13px}
@media(max-width:600px){
 .live-counter{grid-template-columns:repeat(2,1fr)}
 .live-counter div{min-height:90px}
 .live-counter b{font-size:25px}
}


#messageBtn{position:relative;z-index:20;max-width:340px}
#messageBtn:disabled{opacity:.6;cursor:default;transform:none}
#hiddenLetter{
 display:none;opacity:0;transform:translateY(20px) scale(.98);
 max-width:760px;margin:35px auto 0;padding:35px;border-radius:28px;
 background:linear-gradient(145deg,#ff77ad16,#ffffff07);
 border:1px solid #ff77ad38;line-height:2.15;color:#e9dfe6;
 font-size:17px;text-align:right;position:relative;z-index:15;
 transition:1.2s ease;
}

 from{opacity:0;transform:translateY(25px) scale(.97)}
 to{opacity:1;transform:translateY(0) scale(1)}
}
#heartStorm{
 position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden;display:none;
}
.storm-heart{
 position:absolute;top:-70px;color:#ff78ad;font-size:clamp(22px,5vw,46px);
 animation:heartFall linear forwards;
 text-shadow:0 0 15px #ff4f9166;
}
@keyframes heartFall{
 0%{transform:translateY(-80px) rotate(0deg) scale(.7);opacity:0}
 10%{opacity:1}
 50%{transform:translateY(55vh) rotate(180deg) scale(1)}
 100%{transform:translateY(115vh) rotate(360deg) scale(.8);opacity:0}
}


#introOverlay{
 position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 40%,#3d1231,#120a17 65%,#07060b);
 transition:opacity 1s ease,visibility 1s ease;

.intro-inner{text-align:center;padding:25px;max-width:700px}

.gift-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:850px;margin:30px auto}

.gift-card.open .gift-note{max-height:100px;opacity:1;padding-bottom:8px}

.live-counter{grid-template-columns:repeat(3,1fr);max-width:720px}
.live-counter div{min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.live-counter b{font-size:30px}
.live-counter span{color:#cfc1ca;font-size:14px}

#challengeSection{padding-top:35px}
#secretThink{
  width:42px;height:42px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  font-size:25px;opacity:.22;cursor:pointer;border-radius:50%;transition:.25s;
}

#challengePanel{
  max-width:720px;margin:0 auto;padding:28px;border-radius:28px;
  background:#ffffff06;border:1px solid #ffffff0d;display:none;
}

@keyframes challengeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.quiz-progress{text-align:center;color:#ff9bc2;font-size:14px;margin-bottom:15px}
#quizQuestion{text-align:center;font-size:22px;line-height:1.6;margin-bottom:22px}
#quizOptions{display:grid;gap:12px}
.quiz-option{
  width:100%;margin:0;background:#ffffff08;border:1px solid #ffffff15;
  box-shadow:none;padding:14px;border-radius:15px;

#quizFeedback{text-align:center;min-height:30px;margin-top:14px;color:#ffc1d9;font-weight:bold;line-height:1.7}
.challenge-result{
  display:none;text-align:center;padding:28px;border-radius:22px;
  background:#ff77ad0d;border:1px solid #ff77ad35;

.result-emoji{font-size:44px;margin-bottom:10px}

@media(max-width:600px){
 .live-counter{grid-template-columns:repeat(2,1fr)}
 .live-counter div{min-height:90px}
 .live-counter b{font-size:25px}
}
